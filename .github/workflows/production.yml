name: CI/CD Deployment

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      # Wayfinder's Vite plugin runs `php artisan wayfinder:generate`, so the app must boot
      - name: Prepare environment for build
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # 2. Setup Node and build frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      # 3. Clean up before upload
      - name: Remove files not needed on the server
        run: |
          rm -rf node_modules .git .github tests
          rm -f .env .env.example phpunit.xml

      # 4. Prepare Server (Clear old assets to prevent storage bloat)
      - name: Clear old Vite assets on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.JATRIQ_PROD_HOST }}
          username: ${{ secrets.JATRIQ_PROD_USER }}
          port: ${{ secrets.JATRIQ_PROD_PORT }}
          password: ${{ secrets.JATRIQ_PROD_PASS }}
          script: |
            rm -rf /home/u743881222/domains/opizzburger.fr/public_html/jatriq/public/build/*

      # 5. Deploy Files
      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.JATRIQ_PROD_HOST }}
          username: ${{ secrets.JATRIQ_PROD_USER }}
          port: ${{ secrets.JATRIQ_PROD_PORT }}
          password: ${{ secrets.JATRIQ_PROD_PASS }}
          source: "."
          target: "/home/u743881222/domains/opizzburger.fr/public_html/jatriq"

      # 6. Post-Deployment Optimization & Migrations
      - name: Run Artisan Commands on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.JATRIQ_PROD_HOST }}
          username: ${{ secrets.JATRIQ_PROD_USER }}
          port: ${{ secrets.JATRIQ_PROD_PORT }}
          password: ${{ secrets.JATRIQ_PROD_PASS }}
          script: |
            set -e
            cd /home/u743881222/domains/opizzburger.fr/public_html/jatriq

            # Hostinger's default CLI php can be older than the site's; the lockfile needs 8.4
            PHP=/opt/alt/php84/usr/bin/php
            [ -x "$PHP" ] || PHP=php
            $PHP -v

            # Rebuild the package manifest against the uploaded vendor/
            $PHP artisan package:discover --ansi

            # Clear and rebuild caches for production speed
            $PHP artisan optimize:clear
            $PHP artisan optimize

            # Run database migrations automatically (Optional, remove if you prefer manual migrations)
            $PHP artisan migrate --force
