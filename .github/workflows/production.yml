name: CI/CD Deployment

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

        # ---------- Node / Vite assets ----------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ---------- Clean up before upload ----------
      - name: Remove files not needed on the server
        run: |
          rm -rf node_modules .git .github tests
          rm -f .env .env.example phpunit.xml

      # ---------- Deploy ----------
      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.JATRIQ_PROD_HOST }}
          username: ${{ secrets.JATRIQ_PROD_USER }}
          port: ${{ secrets.JATRIQ_PROD_PORT }}
          password: ${{ secrets.JATRIQ_PROD_PASS }}
          source: "."
          target: "/home/u743881222/domains/opizzburger.fr/public_html/jatriq"
